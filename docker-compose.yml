services:
  postgres:
    image: postgres:17
    container_name: fimusic-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: fimusic-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    ports:
      - "8080:8080"

    volumes:
      - ./backend/media:/app/media

    depends_on:
      postgres:
        condition: service_healthy

    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"

  frontend:
    build:
      context: ./frontend
    container_name: fimusic-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
